<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - Detalle de Producto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Barra de Navegación Superior -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-area">
                <span>🛒 Marketplace</span>
            </a>
            <div class="search-bar">
                <span></span>
                <input type="text" placeholder="Buscar productos, marcas y más...">
            </div>
            <ul class="nav-links">
                <li><a href="productos.html">Productos</a></li>
                <li><a href="#"> Categorías</a></li>
                <li><a href="#"> Filtros</a></li>
                <li><a href="#">🤍 Favoritos</a></li>
                <li><a href="carrito.html">🛒 Carrito</a></li>
            </ul>
        </div>
    </header>

    <main>
        <div class="detail-layout">
            <!-- Imagen grande del producto -->
            <div class="main-img-box">
                [Imagen Principal: Tenis casuales blancos]
            </div>

            <!-- Información del producto y opciones de compra -->
            <div class="product-info">
                <h1>Tenis casuales blancos</h1>
                <p style="color: #666; font-size: 0.9rem;">⭐⭐⭐⭐⭐ (134 reseñas)</p>
                <div class="product-price">$1,199</div>
                
                <p style="color: #555; font-size: 0.95rem; margin-bottom: 15px;">
                    Tenis de diseño casual, cómodos y sencillos. Ideales para el día a día. Su diseño minimalista combina con todo.
                </p>

                <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

                <label style="font-weight: bold; font-size: 0.9rem;">Talla</label>
                <div class="sizes-container">
                    <button class="size-btn">22</button>
                    <button class="size-btn">23</button>
                    <button class="size-btn active">24</button>
                    <button class="size-btn">25</button>
                    <button class="size-btn">26</button>
                </div>

                <button class="btn-action btn-cart">Agregar al carrito</button>
                <button class="btn-action btn-fav">Agregar a favoritos</button>
            </div>
        </div>
    </main>
</body>
</html>
