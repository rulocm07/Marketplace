<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Marketplace: descubre productos de distintas categorías en un solo lugar.">
    <title>Inicio - Marketplace</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js" defer></script>
    <script src="js/productos.js" defer></script>
</head>
<body data-page="home">
    <div id="site-header"></div>

    <main class="container">
        <!-- Banner principal: sustituye img/banner.jpg por tu propia fotografía. -->
        <section class="hero-banner" aria-label="Bienvenida">
            <div class="hero-text">
                <h1>Todo lo que necesitas,<br>en un solo lugar</h1>
                <p>Descubre miles de productos con los mejores precios.</p>
                <a href="productos.html" class="btn-primary hero-button">Ver productos</a>
            </div>
            <div class="hero-image">
                <img src="img/banner.jpg" alt="Productos y accesorios" loading="eager">
            </div>
        </section>

        <section class="section" aria-labelledby="categories-heading">
            <div class="section-header">
                <h2 id="categories-heading">Categorías destacadas</h2>
                <a href="productos.html">Ver todas →</a>
            </div>
            <div class="categories-grid" id="home-categories"></div>
        </section>

        <section class="section" aria-labelledby="featured-heading">
            <div class="section-header">
                <h2 id="featured-heading">Productos destacados</h2>
                <a href="productos.html">Explorar catálogo →</a>
            </div>
            <div class="products-grid" id="featured-products"></div>
        </section>
    </main>

    <div id="site-footer"></div>
</body>
</html>
