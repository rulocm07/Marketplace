<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explora nuestro catálogo y filtra productos por categoría y precio.">
    <title>Productos - Marketplace</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js" defer></script>
    <script src="js/productos.js" defer></script>
</head>
<body data-page="products">
    <div id="site-header"></div>

    <main class="container">
        <div class="page-heading">
            <div>
                <h1>Productos</h1>
                <p class="muted">Encuentra lo que necesitas y filtra por categoría o precio.</p>
            </div>
        </div>

        <div class="catalog-layout">
            <aside class="filters-sidebar" id="filtros" aria-label="Filtrar productos">
                <h3 id="categorias">Filtros</h3>
                <div class="filter-group">
                    <strong>Categorías</strong>
                    <div id="category-filter"></div>
                </div>
                <div class="filter-group">
                    <label for="price-filter"><strong>Precio máximo</strong></label>
                    <input type="range" id="price-filter" min="0" max="20000" step="100" value="20000">
                    <div class="small muted" id="price-label"></div>
                </div>
                <button class="btn-ghost full" type="button" id="clear-filters">Limpiar filtros</button>
            </aside>

            <section aria-label="Listado de productos">
                <div class="catalog-top">
                    <span class="muted" id="result-count"></span>
                    <label class="small" for="sort-filter">
                        Ordenar por
                        <select id="sort-filter" class="sort-select">
                            <option value="default">Relevancia</option>
                            <option value="min">Menor precio</option>
                            <option value="max">Mayor precio</option>
                        </select>
                    </label>
                </div>
                <div class="field catalog-search-field">
                    <label for="catalog-search">Buscar en el catálogo</label>
                    <input id="catalog-search" type="search" placeholder="Nombre o categoría del producto">
                </div>
                <div class="products-grid" id="catalog-results"></div>
            </section>
        </div>
    </main>

    <div id="site-footer"></div>
</body>
</html>
