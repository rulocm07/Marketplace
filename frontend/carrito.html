<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Revisa los productos agregados a tu carrito de Marketplace.">
    <title>Carrito de compras - Marketplace</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js" defer></script>
    <script src="js/carrito.js" defer></script>
</head>
<body data-page="cart">
    <div id="site-header"></div>

    <main class="container">
        <div class="page-heading">
            <div>
                <h1>Carrito de compras</h1>
                <p class="muted">Revisa tus productos, ajusta cantidades y consulta el total.</p>
            </div>
        </div>
        <div class="cart-layout">
            <section class="cart-items-list" id="cart-items" aria-label="Productos en el carrito"></section>
            <aside class="panel" id="cart-summary" aria-label="Resumen de compra"></aside>
        </div>
    </main>

    <div id="site-footer"></div>
</body>
</html>
